# ===============================================
# Arch Linux Installation Configuration File
# ===============================================

# 1. DISK AND PARTITIONING
# ------------------------
# Example: /dev/sda, /dev/nvme0n1
TARGET_DISK="/dev/sdb" # **MUST be updated to your actual disk**

# Partition Names (as they will be after creation)
# Example: /dev/sda1, /dev/nvme0n1p1
EFI_PARTITION="${TARGET_DISK}1"
ROOT_PARTITION="${TARGET_DISK}2"
SWAP_PARTITION="${TARGET_DISK}3"
LUKS_NAME="cryptroot"

# Filesystem types
# Common: btrfs, (ext4, xfs)
ROOT_FS_TYPE="btrfs"

# Swap size in Megabytes (e.g., 4096MB)
SWAP_SIZE_MB="4096"

# 2. SYSTEM LOCALIZATION AND TIME
# ------------------------------
# Locale to generate and set (e.g., en_US.UTF-8, de_DE.UTF-8)
SYSTEM_LOCALE="en_US.UTF-8"
# Country for repositories
SYSTEM_COUNTRY="Australia"
# Timezone (e.g., America/New_York, Europe/Berlin, Australia/Victoria)
TIME_ZONE="Australia/Victoria"
# Console keyboard layout (e.g., us, de, fr)
KEYMAP="us"
# Console font (e.g., lat9w-16, drdos8x16)
FONT="lat9w-16"

# 3. NETWORK AND HOSTNAME
# -----------------------
# The hostname for the new system
HOST_NAME="archlinux"

# 4. USER AND ROOT ACCOUNTS
# -------------------------
# Username for the main non-root user
USER_NAME="archuser"
# Note: Passwords should be set securely *within the script*, not here.
# For security, DO NOT store plaintext passwords in this file.
USER_PASSWORD=""
# Default shell for new users (e.g., /bin/bash, /bin/zsh)
USER_SHELL="/bin/bash"

# 5. PACMAN AND SOFTWARE
# ----------------------
# List of packages for the base system (essential)
BASE_PACKAGES=(
    "base"
    "linux"
    "linux-firmware"
    "vim"
    "nano"
    "dhcpcd"
    "networkmanager"
)

# List of common utility/desktop packages
COMMON_PACKAGES=(
    "sudo"
    "git"
    "mg"
    "openssh"
    "intel-ucode" # Use "amd-ucode" for AMD CPUs
)

# Bootloader choice: systemd-boot, grub
BOOTLOADER="systemd-boot"

# ===============================================
# END OF CONFIGURATION
# ===============================================